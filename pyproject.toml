[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distance-decayed-memory"
version = "0.0.0"
description = "Distance-decayed KV memory experiments for causal video prediction"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "black>=25.1",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
